title: Chicken croquettes
description: 'A test recipe for grouped ingredients: crisp chicken croquettes with a béchamel base, built from three separate components — the chicken filling, the roux, and the breading.'
publishedAt: 2026-11-18
draft: false
servings: about 20 croquettes
prepTime: 45 minutes
cookTime: 35 minutes
ingredients:
  - component: Chicken filling
    items:
      - 2 tbsp olive oil
      - 1 small brown onion, finely diced
      - 2 garlic cloves, minced
      - 500 g chicken thigh, finely chopped
      - 1 tsp sweet paprika
      - ½ tsp dried oregano
      - 100 ml chicken stock
      - 2 tbsp flat-leaf parsley, finely chopped
      - salt and black pepper
  - component: Roux
    items:
      - 60 g unsalted butter
      - 60 g plain flour
      - 500 ml whole milk, warmed
      - ¼ tsp freshly grated nutmeg
      - salt, to taste
  - component: Breading and frying
    items:
      - 100 g plain flour
      - 3 large eggs, beaten
      - 200 g panko breadcrumbs
      - 1 litre neutral oil, for deep-frying
method:
  - component: Make the chicken filling
    steps:
      - >-
        Heat the olive oil in a large frying pan over medium heat. Add the onion
        and a pinch of salt, and cook for 5–6 minutes until soft and
        translucent.
      - >-
        Add the garlic, paprika, and oregano, and cook for 1 minute until
        fragrant.
      - >-
        Add the chicken, season with salt and pepper, and cook for 6–8 minutes,
        breaking up any lumps, until just cooked through.
      - >-
        Pour in the stock and simmer for 2–3 minutes until it has nearly
        evaporated. Stir through the parsley, then tip the mixture into a large
        bowl.
  - component: Make the roux
    steps:
      - >-
        Melt the butter in a saucepan over medium heat. Add the flour and cook,
        stirring constantly, for 1–2 minutes until it smells toasty and looks
        sandy.
      - >-
        Add the warm milk a splash at a time, whisking constantly so no lumps
        form.
      - >-
        Simmer for 5–8 minutes, stirring, until very thick. It should hold the
        line drawn through it with a spoon. Season with nutmeg, salt, and
        pepper.
  - component: Combine and chill
    steps:
      - >-
        Scrape the roux into the bowl of chicken and fold until evenly combined.
        Taste and adjust the seasoning.
      - >-
        Spread the mixture into a shallow dish, press a sheet of plastic wrap
        onto the surface, and refrigerate for at least 4 hours, or overnight,
        until firm. A cold mixture is essential for shaping.
  - component: Shape and bread
    steps:
      - 'Set up three bowls: flour, beaten egg, and panko.'
      - >-
        Scoop about 2 tbsp of the chilled mixture and roll into 8 cm logs or
        balls. Dust each one in flour, dip it in egg, then coat in panko,
        pressing gently so the crumbs stick. Use one hand for the dry steps and
        one for the wet.
      - >-
        Arrange the croquettes on a tray and chill for 30 minutes to set the
        crumb.
  - component: Fry and serve
    steps:
      - >-
        Heat the oil to 180°C in a deep saucepan or fryer. Fry in batches of
        four or five for 3–4 minutes, until deep golden. Do not crowd the pan.
      - >-
        Drain on a wire rack rather than paper so the crust stays crisp, and
        season with salt while hot.
      - Serve immediately with lemon wedges and aioli.
notes:
  - >-
    The shaped, unbreaded croquettes freeze well for up to a month. Fry them from
    frozen, adding a minute or two to the cooking time.
  - >-
    No deep-fryer? Shallow-fry in 2 cm of oil, turning to brown all sides.
